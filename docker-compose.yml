services:
  # ============================================================
  # SPARK MASTER
  # ============================================================
  spark-master:
    build:
      context: .
      dockerfile: Dockerfile
    image: spark-pyspark:3.5.3
    container_name: spark-master
    hostname: spark-master
    environment:
      - SPARK_MODE=master
      - SPARK_NO_DAEMONIZE=true
    ports:
      - "8080:8080"
      - "7077:7077"
    volumes:
      - ./app:/app
      - ./data:/data
    networks:
      - airquality-network
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master

  # ============================================================
  # SPARK WORKER 1
  # ============================================================
  spark-worker-1:
    build:
      context: .
      dockerfile: Dockerfile
    image: spark-pyspark:3.5.3
    container_name: spark-worker-1
    hostname: spark-worker-1
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER=spark://spark-master:7077
      - SPARK_WORKER_MEMORY=2G
      - SPARK_WORKER_CORES=2
      - SPARK_NO_DAEMONIZE=true
    ports:
      - "8081:8081"
    volumes:
      - ./app:/app
      - ./data:/data
    depends_on:
      - spark-master
    networks:
      - airquality-network
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077

  # ============================================================
  # SPARK APP (pour soumettre les jobs)
  # ============================================================
  spark-app:
    build:
      context: .
      dockerfile: Dockerfile
    image: spark-pyspark:3.5.3
    container_name: spark-app
    hostname: spark-app
    user: root
    environment:
      - PYSPARK_PYTHON=python3
      - PYSPARK_DRIVER_PYTHON=python3
    volumes:
      - ./app:/app
      - ./data:/data
      - ./checkpoint:/checkpoint
    depends_on:
      - spark-master
      - spark-worker-1
    networks:
      - airquality-network
    command: ["tail", "-f", "/dev/null"]

# ============================================================
# NETWORK
# ============================================================
networks:
  airquality-network:
    driver: bridge