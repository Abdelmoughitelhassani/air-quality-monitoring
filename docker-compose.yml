services:
  # ============================================================
  # SPARK MASTER
  # ============================================================
  spark-master:
    build:
      context: .
      dockerfile: Dockerfile
    image: spark-pyspark:3.5.3
    container_name: spark-master
    hostname: spark-master
    environment:
      - SPARK_MODE=master
      - SPARK_NO_DAEMONIZE=true
    ports:
      - "8080:8080"
      - "7077:7077"
    volumes:
      - ./app:/app
      - ./data:/data
    networks:
      - airquality-network
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master

  # ============================================================
  # SPARK WORKER 1
  # ============================================================
  spark-worker-1:
    build:
      context: .
      dockerfile: Dockerfile
    image: spark-pyspark:3.5.3
    container_name: spark-worker-1
    hostname: spark-worker-1
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER=spark://spark-master:7077
      - SPARK_WORKER_MEMORY=2G
      - SPARK_WORKER_CORES=2
      - SPARK_NO_DAEMONIZE=true
    ports:
      - "8081:8081"
    volumes:
      - ./app:/app
      - ./data:/data
    depends_on:
      - spark-master
    networks:
      - airquality-network
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077

  # ============================================================
  # SPARK APP (pour soumettre les jobs)
  # ============================================================
  spark-app:
    build:
      context: .
      dockerfile: Dockerfile
    image: spark-pyspark:3.5.3
    container_name: spark-app
    hostname: spark-app
    user: root
    environment:
      - PYSPARK_PYTHON=python3
      - PYSPARK_DRIVER_PYTHON=python3
    volumes:
      - ./app:/app
      - ./data:/data
      - ./checkpoint:/checkpoint
    depends_on:
      - spark-master
      - spark-worker-1
      - postgres  # ← Ajouté: attend que PostgreSQL soit prêt
    networks:
      - airquality-network
    command: ["tail", "-f", "/dev/null"]

  # ============================================
  # PostgreSQL Database
  # ============================================
  postgres:
    image: postgres:15-alpine
    container_name: postgres-airquality
    hostname: postgres
    environment:
      POSTGRES_USER: airquality_user
      POSTGRES_PASSWORD: airquality_pass
      POSTGRES_DB: airquality
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-postgres.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - airquality-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airquality_user -d airquality"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ============================================
  # pgAdmin (Interface Web PostgreSQL) - OPTIONNEL
  # ============================================
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin-airquality
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@airquality.local
      PGADMIN_DEFAULT_PASSWORD: admin123
      PGADMIN_LISTEN_PORT: 80
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - airquality-network
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

# ============================================
# Volumes persistants
# ============================================
volumes:
  postgres_data:
    name: airquality_postgres_data
  pgadmin_data:
    name: airquality_pgadmin_data

# ============================================================
# NETWORK
# ============================================================
networks:
  airquality-network:
    name: airquality-network
    driver: bridge